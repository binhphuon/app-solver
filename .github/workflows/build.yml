name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Cho phép chạy thủ công từ GitHub UI
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Cache Gradle
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Cấp quyền thực thi gradlew
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Build Debug APK (không cần signing)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. Upload APK lên Artifacts (tải về từ GitHub)
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiCaptchaSolver-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # --- Optional: Build Release APK (cần keystore) ---
